name: Promote CodeJourney to production

# Prepares a production release; the owner still decides it twice (homelab-infra
# ADR-027, decision D-12, ADR-011):
#   1. the `approve` job waits for the owner's approval (environment `production`,
#      required reviewer);
#   2. after approval, the stage digests of one released CodeJourney revision are copied
#      into the production Zot repositories and written to homelab-release-state
#      apps/codejourney/prod (image and source annotation only, 2 files, 4 lines);
#   3. Argo CD Application prod-codejourney-release is manual: nothing runs in production
#      until the owner reviews its diff and syncs it.
# This workflow holds no credential that can write homelab-infra or reach a cluster.
# notify-requested / notify-result copy the request and the outcome to Slack #deploys
# (ADR-030 S2); they hold only that webhook and approve nothing.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character CodeJourney commit already released to stage
        required: true
        type: string

concurrency:
  group: codejourney-prod-promotion
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_STATE_REPOSITORY: J4yM1l/homelab-release-state
  RELEASE_STATE_BRANCH: main
  STAGE_DIR: apps/codejourney/stage
  REGISTRY: 192.168.0.45:30080
  ZOT_PUSH_USER: ci-pusher
  CRANE_VERSION: 0.22.1
  CRANE_ARM64_SHA256: 898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110

jobs:
  approve:
    # Approval gate only: environment `production` has the owner as required reviewer and
    # deployment branches limited to main. It holds no secrets and runs nothing.
    environment: production
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Approved
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: echo "Promotion of ${SOURCE_SHA} approved by the production environment reviewer."

  prepare-promotion:
    needs: approve
    # Same environment as the stage pipeline (deployment branches: main only): it holds
    # ZOT_PUSH_PASSWORD and RELEASE_STATE_TOKEN.
    environment: GITOPS_TOKEN
    runs-on: [self-hosted, k3s-gitops]
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.write.outputs.commit }}
      web_image: ${{ steps.prod.outputs.web_image }}
      api_image: ${{ steps.prod.outputs.api_image }}

    steps:
      - name: Validate input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          echo "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout pipeline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ops
          persist-credentials: false

      - name: Checkout release state (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.RELEASE_STATE_REPOSITORY }}
          ref: ${{ env.RELEASE_STATE_BRANCH }}
          token: ${{ secrets.RELEASE_STATE_TOKEN }}
          path: release-state
          fetch-depth: 0
          persist-credentials: false

      - name: Find the stage digests released for this revision
        id: stage
        working-directory: release-state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          # Provenance: a revision is in this history only if the stage pipeline released
          # it, and that pipeline accepts only dispatches from CodeJourney main
          # (homelab-infra P1.4, P3.1). Newest matching commit wins.
          found=""
          for commit in $(git log --format=%H -- "${STAGE_DIR}"); do
            if git show "${commit}:${STAGE_DIR}/web-deployment.yaml" \
                 | grep -q "codejourney.homelab/source-revision: \"${SOURCE_SHA}\"" \
               && git show "${commit}:${STAGE_DIR}/api-deployment.yaml" \
                 | grep -q "codejourney.homelab/source-revision: \"${SOURCE_SHA}\""; then
              found="${commit}"
              break
            fi
          done
          if [ -z "${found}" ]; then
            echo "::error::${SOURCE_SHA} was never released to stage (not in ${RELEASE_STATE_REPOSITORY})"
            exit 1
          fi
          image() {
            git show "${found}:${STAGE_DIR}/$1-deployment.yaml" \
              | sed -nE "s#^ +image: (${REGISTRY}/codejourney-stage-$1:stage-[0-9a-f]{12}@sha256:[0-9a-f]{64})\$#\1#p"
          }
          web="$(image web)"; api="$(image api)"
          test "$(printf '%s\n' "${web}" | grep -c .)" = 1
          test "$(printf '%s\n' "${api}" | grep -c .)" = 1
          echo "release_state_commit=${found}" >> "${GITHUB_OUTPUT}"
          echo "web_image=${web}" >> "${GITHUB_OUTPUT}"
          echo "api_image=${api}" >> "${GITHUB_OUTPUT}"
          if [ "$(git log -1 --format=%H -- "${STAGE_DIR}")" = "${found}" ]; then
            echo "current_stage=yes" >> "${GITHUB_OUTPUT}"
          else
            echo "current_stage=no" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install checksum-verified crane
        run: |
          set -eu
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}" "${RUNNER_TEMP}/docker"
          archive="${RUNNER_TEMP}/go-containerregistry_Linux_arm64.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_arm64.tar.gz"
          echo "${CRANE_ARM64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${bin}" crane
          chmod 0755 "${bin}/crane"
          echo "${bin}" >> "${GITHUB_PATH}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker" >> "${GITHUB_ENV}"
          "${bin}/crane" version

      - name: Trust the Homelab root CA for Zot
        run: |
          set -eu
          bundle="${RUNNER_TEMP}/ca-bundle.pem"
          cat /etc/ssl/certs/ca-certificates.crt ops/certs/homelab-root-ca.crt > "${bundle}"
          echo "SSL_CERT_FILE=${bundle}" >> "${GITHUB_ENV}"

      - name: Authenticate to Zot
        env:
          ZOT_PUSH_PASSWORD: ${{ secrets.ZOT_PUSH_PASSWORD }}
        run: |
          set -eu
          test -n "${ZOT_PUSH_PASSWORD}"
          printf '%s' "${ZOT_PUSH_PASSWORD}" | crane auth login "${REGISTRY}" -u "${ZOT_PUSH_USER}" --password-stdin

      - name: Copy the stage digests to the production repositories
        id: prod
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WEB_STAGE: ${{ steps.stage.outputs.web_image }}
          API_STAGE: ${{ steps.stage.outputs.api_image }}
        run: |
          set -eu
          tag="prod-${SOURCE_SHA:0:12}"
          promote() {
            component="$1"; stage_ref="$2"
            digest="${stage_ref##*@}"
            source="${stage_ref%%:stage-*}@${digest}"
            target="${REGISTRY}/codejourney-prod-${component}:${tag}"
            # A production tag is never moved to another digest.
            if existing="$(crane digest "${target}" 2>/dev/null)"; then
              if [ "${existing}" != "${digest}" ]; then
                echo "::error::${target} already points to ${existing}, not ${digest}"
                exit 1
              fi
              echo "${target} already at ${digest}; not copied again"
            else
              crane copy "${source}" "${target}"
            fi
            test "$(crane digest "${target}")" = "${digest}"
            echo "${component}_image=${target}@${digest}" >> "${GITHUB_OUTPUT}"
          }
          promote web "${WEB_STAGE}"
          promote api "${API_STAGE}"

      - name: Write the production release state
        id: write
        working-directory: release-state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WEB_IMAGE: ${{ steps.prod.outputs.web_image }}
          API_IMAGE: ${{ steps.prod.outputs.api_image }}
          RELEASE_STATE_TOKEN: ${{ secrets.RELEASE_STATE_TOKEN }}
        run: |
          set -eu
          git checkout -q "${RELEASE_STATE_BRANCH}"
          python3 ../ops/scripts/update-stage-manifests.py \
            --state-dir . --environment prod \
            --source-revision "${SOURCE_SHA}" \
            --web-image "${WEB_IMAGE}" --api-image "${API_IMAGE}"
          if git diff --quiet; then
            echo "Production release state already references CodeJourney ${SOURCE_SHA}."
            echo "commit=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Exactly the image line and the source annotation in each of the two files.
          numstat="$(git diff --numstat | sort)"
          expected="$(printf '2\t2\tapps/codejourney/prod/api-deployment.yaml\n2\t2\tapps/codejourney/prod/web-deployment.yaml')"
          if [ "${numstat}" != "${expected}" ]; then
            echo "::error::unexpected change set:"; git diff --stat; exit 1
          fi
          git diff --check
          git config user.name "codejourney-release-bot"
          git config user.email "codejourney-release-bot@users.noreply.github.com"
          git add apps/codejourney/prod/api-deployment.yaml apps/codejourney/prod/web-deployment.yaml
          git commit \
            -m "deploy(prod): CodeJourney ${SOURCE_SHA:0:12} (awaiting manual sync)" \
            -m "Source: https://github.com/J4yM1l/CodeJourney/commit/${SOURCE_SHA}" \
            -m "Approved run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          push() {
            git -c credential.helper= \
              -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${RELEASE_STATE_TOKEN}"; }; f' \
              "$@"
          }
          # The stage pipeline may have pushed meanwhile: rebase once and retry.
          if ! push push origin "HEAD:${RELEASE_STATE_BRANCH}"; then
            push pull --rebase origin "${RELEASE_STATE_BRANCH}"
            push push origin "HEAD:${RELEASE_STATE_BRANCH}"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish promotion summary
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WEB_IMAGE: ${{ steps.prod.outputs.web_image }}
          API_IMAGE: ${{ steps.prod.outputs.api_image }}
          STATE_COMMIT: ${{ steps.stage.outputs.release_state_commit }}
          CURRENT_STAGE: ${{ steps.stage.outputs.current_stage }}
          PROD_COMMIT: ${{ steps.write.outputs.commit }}
        run: |
          {
            echo "## CodeJourney production promotion written (awaiting manual sync)"
            echo
            echo "- Source revision: \`${SOURCE_SHA}\`"
            echo "- Stage release: \`${RELEASE_STATE_REPOSITORY}@${STATE_COMMIT:0:12}\` (currently on stage: ${CURRENT_STAGE})"
            echo "- Web: \`${WEB_IMAGE}\`"
            echo "- API: \`${API_IMAGE}\`"
            if [ -n "${PROD_COMMIT}" ]; then
              echo "- Production release state: \`${RELEASE_STATE_REPOSITORY}@${PROD_COMMIT:0:12}\` (2 files, 4 lines)"
            else
              echo "- Production release state already at this revision; nothing committed"
            fi
            echo
            echo "Production is unchanged until you review the diff of Argo CD Application"
            echo "\`prod-codejourney-release\` and sync it by hand (homelab-infra runbook"
            echo "\`docs/runbooks/codejourney-release.md\`)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove registry credentials from the runner
        if: always()
        run: |
          crane auth logout "${REGISTRY}" || true
          rm -rf "${RUNNER_TEMP}/docker"

  notify-requested:
    # Tells the owner a promotion waits for approval; runs beside `approve`.
    # Slack #deploys copy (homelab-infra ADR-030, unit S2): GitHub-hosted runner,
    # environment slack-notify holds only the #deploys webhook (deployment branches:
    # main). It runs after the release and can neither block nor change it.
    environment: slack-notify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout the notify script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/slack-notify.sh
          sparse-checkout-cone-mode: false

      - name: Post the request to #deploys
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$' || SOURCE_SHA="(invalid revision)"
          short="${SOURCE_SHA:0:12}"
          export STATE=waiting TITLE="Production promotion of CodeJourney ${short} waits for approval"
          export BODY="$(printf '%s\n' \
            "Requested by ${ACTOR}. Source <https://github.com/J4yM1l/CodeJourney/commit/${SOURCE_SHA}|${short}>" \
            "Approve or reject it in the run (environment \`production\`). Approval is only given in GitHub; production changes only after a manual sync of \`prod-codejourney-release\`.")"
          bash scripts/slack-notify.sh

  notify-result:
    needs: [approve, prepare-promotion]
    if: always()
    # Slack #deploys copy (homelab-infra ADR-030, unit S2): GitHub-hosted runner,
    # environment slack-notify holds only the #deploys webhook (deployment branches:
    # main). It runs after the release and can neither block nor change it.
    environment: slack-notify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout the notify script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/slack-notify.sh
          sparse-checkout-cone-mode: false

      - name: Post the result to #deploys
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPROVE: ${{ needs.approve.result }}
          PREPARE: ${{ needs.prepare-promotion.result }}
          COMMIT: ${{ needs.prepare-promotion.outputs.commit }}
          WEB_IMAGE: ${{ needs.prepare-promotion.outputs.web_image }}
          API_IMAGE: ${{ needs.prepare-promotion.outputs.api_image }}
        run: |
          set -eu
          echo "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$' || SOURCE_SHA="(invalid revision)"
          short="${SOURCE_SHA:0:12}"
          if [ "${APPROVE}" != "success" ]; then
            export STATE=rejected TITLE="Production promotion of CodeJourney ${short} not approved (${APPROVE})"
            export BODY="Nothing was copied or written; production is unchanged."
          elif [ "${PREPARE}" != "success" ]; then
            export STATE=failed TITLE="Production promotion of CodeJourney ${short} ${PREPARE}"
            export BODY="Approved, but preparing the release did not finish; see the run. Production is unchanged."
          elif [ -z "${COMMIT}" ]; then
            export STATE=info TITLE="CodeJourney ${short} already in the production release state"
            export BODY="Nothing new was written. If production does not run it yet, review and sync \`prod-codejourney-release\`."
          else
            export STATE=written TITLE="CodeJourney ${short} written for production, awaiting your manual sync"
            export BODY="$(printf '%s\n' \
              "Release state <https://github.com/J4yM1l/homelab-release-state/commit/${COMMIT}|${COMMIT:0:12}> (2 files, 4 lines)" \
              "Web \`${WEB_IMAGE##*@}\`" \
              "API \`${API_IMAGE##*@}\`" \
              "Next: read the full Argo CD diff of \`prod-codejourney-release\` (only the image and source-revision lines may change), then sync by hand.")"
          fi
          bash scripts/slack-notify.sh
