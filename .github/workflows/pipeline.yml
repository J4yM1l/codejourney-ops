name: Publish stage release to Zot

on:
  repository_dispatch:
    types: [deploy-stage]

concurrency:
  group: codejourney-stage-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: J4yM1l/CodeJourney
  # Releases come only from reviewed CodeJourney main (homelab-infra plan P3.1, F-019).
  SOURCE_BRANCH: main
  # Stage release state lives in its own repository; this pipeline cannot write
  # homelab-infra (homelab-infra ADR-021, remediation P1.6).
  RELEASE_STATE_REPOSITORY: J4yM1l/homelab-release-state
  RELEASE_STATE_BRANCH: main
  # Zot serves HTTPS with a Homelab CA certificate and requires ci-pusher to push
  # (homelab-infra ADR-017).
  REGISTRY: 192.168.0.45:30080
  ZOT_PUSH_USER: ci-pusher
  WEB_REPOSITORY: codejourney-stage-web
  API_REPOSITORY: codejourney-stage-api
  CRANE_VERSION: 0.22.1
  CRANE_ARM64_SHA256: 898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110

jobs:
  release-stage:
    environment: GITOPS_TOKEN
    runs-on: [self-hosted, k3s-gitops]
    timeout-minutes: 30

    steps:
      - name: Validate dispatch provenance
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          SOURCE_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          WEB_CANDIDATE: ${{ github.event.client_payload.web_image }}
          API_CANDIDATE: ${{ github.event.client_payload.api_image }}
        run: |
          set -eu
          test "${SOURCE_REF}" = "refs/heads/${SOURCE_BRANCH}"
          test "${DISPATCH_REPOSITORY}" = "${SOURCE_REPOSITORY}"
          echo "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          echo "${WEB_CANDIDATE}" | grep -Eq '^ghcr\.io/j4ym1l/codejourney-stage-web@sha256:[0-9a-f]{64}$'
          echo "${API_CANDIDATE}" | grep -Eq '^ghcr\.io/j4ym1l/codejourney-stage-api@sha256:[0-9a-f]{64}$'

      - name: Checkout pipeline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ops
          persist-credentials: false

      - name: Install checksum-verified crane
        run: |
          set -eu
          # Per-job paths under RUNNER_TEMP, which the runner empties after every job:
          # nothing a job installs or logs in to outlives it, and no root is needed.
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}" "${RUNNER_TEMP}/docker"
          archive="${RUNNER_TEMP}/go-containerregistry_Linux_arm64.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_arm64.tar.gz"
          echo "${CRANE_ARM64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${bin}" crane
          chmod 0755 "${bin}/crane"
          echo "${bin}" >> "${GITHUB_PATH}"
          # crane keeps registry logins in DOCKER_CONFIG; keep them in this job only.
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker" >> "${GITHUB_ENV}"
          "${bin}/crane" version

      - name: Authenticate to the candidate registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          printf '%s' "${GHCR_TOKEN}" | crane auth login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Trust the Homelab root CA for Zot
        run: |
          set -eu
          # System roots are kept (ghcr.io) and the Homelab root CA is added (Zot).
          bundle="${RUNNER_TEMP}/ca-bundle.pem"
          cat /etc/ssl/certs/ca-certificates.crt ops/certs/homelab-root-ca.crt > "${bundle}"
          echo "SSL_CERT_FILE=${bundle}" >> "${GITHUB_ENV}"

      - name: Authenticate to Zot
        env:
          ZOT_PUSH_PASSWORD: ${{ secrets.ZOT_PUSH_PASSWORD }}
        run: |
          set -eu
          test -n "${ZOT_PUSH_PASSWORD}"
          printf '%s' "${ZOT_PUSH_PASSWORD}" | crane auth login "${REGISTRY}" -u "${ZOT_PUSH_USER}" --password-stdin

      - name: Copy validated AMD64 images into Zot
        id: images
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          WEB_CANDIDATE: ${{ github.event.client_payload.web_image }}
          API_CANDIDATE: ${{ github.event.client_payload.api_image }}
        run: |
          set -eu
          # Tag stage-<12-char SHA>, the form the stage manifests reference.
          release_tag="stage-${SOURCE_SHA:0:12}"
          web_tag="${REGISTRY}/${WEB_REPOSITORY}:${release_tag}"
          api_tag="${REGISTRY}/${API_REPOSITORY}:${release_tag}"
          crane copy "${WEB_CANDIDATE}" "${web_tag}"
          crane copy "${API_CANDIDATE}" "${api_tag}"
          web_digest="$(crane digest "${web_tag}")"
          api_digest="$(crane digest "${api_tag}")"
          test "${WEB_CANDIDATE##*@}" = "${web_digest}"
          test "${API_CANDIDATE##*@}" = "${api_digest}"
          echo "web_image=${web_tag}@${web_digest}" >> "${GITHUB_OUTPUT}"
          echo "api_image=${api_tag}@${api_digest}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.RELEASE_STATE_REPOSITORY }}
          ref: ${{ env.RELEASE_STATE_BRANCH }}
          token: ${{ secrets.RELEASE_STATE_TOKEN }}
          path: release-state
          # Do not leave the token in release-state/.git/config for later steps; only the
          # push step below receives it.
          persist-credentials: false

      - name: Update stage manifests by digest
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
        run: |
          set -eu
          python3 ops/scripts/update-stage-manifests.py \
            --state-dir release-state \
            --source-revision "${SOURCE_SHA}" \
            --web-image "${WEB_IMAGE}" \
            --api-image "${API_IMAGE}"

      - name: Commit release state
        working-directory: release-state
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          RELEASE_STATE_TOKEN: ${{ secrets.RELEASE_STATE_TOKEN }}
        run: |
          set -eu
          if git diff --quiet; then
            echo "Stage already references CodeJourney ${SOURCE_SHA}."
            exit 0
          fi
          git diff --check
          git config user.name "codejourney-release-bot"
          git config user.email "codejourney-release-bot@users.noreply.github.com"
          git add apps/codejourney/stage/api-deployment.yaml \
            apps/codejourney/stage/web-deployment.yaml
          git commit \
            -m "deploy(stage): CodeJourney ${SOURCE_SHA:0:12}" \
            -m "Source: https://github.com/${SOURCE_REPOSITORY}/commit/${SOURCE_SHA}" \
            -m "Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The credential helper reads the token from the environment when git asks
          # for it, so the token never appears in a URL, argv or .git/config.
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${RELEASE_STATE_TOKEN}"; }; f' \
            push origin "HEAD:${RELEASE_STATE_BRANCH}"

      - name: Publish release summary
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
        run: |
          {
            echo "## CodeJourney stage release"
            echo
            echo "- Source branch: \`${SOURCE_BRANCH}\`"
            echo "- Source revision: \`${SOURCE_SHA}\`"
            echo "- Web: \`${WEB_IMAGE}\`"
            echo "- API: \`${API_IMAGE}\`"
            echo "- Deployment: Argo CD auto-syncs \`stage-codejourney-release\` from \`${RELEASE_STATE_REPOSITORY}\`"
            echo "- Production: unchanged; promotion remains manual"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove registry credentials from the runner
        if: always()
        run: |
          crane auth logout "${REGISTRY}" || true
          crane auth logout ghcr.io || true
          rm -rf "${RUNNER_TEMP}/docker"
